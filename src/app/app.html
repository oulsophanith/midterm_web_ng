<app-navbar
  [searchText]="searchText"
  [selectedCategory]="selectedCategory"
  (searchChange)="searchText = $event"
  (categoryChange)="selectedCategory = $event"
/>

<main id="home">
  <app-main-slider-component />

  <section class="container products-section" id="products" aria-labelledby="products-title">
    <div class="products-heading">
      <div>
        <h1 id="products-title">OUR PRODUCTS</h1>
        <p aria-live="polite">Products: {{ filteredProducts.length }}</p>
      </div>
      @if (searchText || selectedCategory !== 'All products') {
        <button class="clear-button" (click)="clearFilters()">Clear filters</button>
      }
    </div>

    <div class="product-grid">
      @for (item of filteredProducts; track item.id) {
        <app-product-card-component [product]="item" />
      } @empty {
        <p class="empty-message">No products found. Try another search or clear your filters.</p>
      }
    </div>
  </section>
</main>

<app-footer />
